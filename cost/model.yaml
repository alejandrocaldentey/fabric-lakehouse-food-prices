# Cost model — rendered into docs/cost.md by `python -m cost.render`.
#
# Rules:
# - Every unit price carries its source URL, region and the date it was checked.
# - A price that has not been verified stays null and is reported as "pending";
#   it is never guessed.
# - Monthly cost = usage per month x unit price (low/high range).
# - Prices exclude VAT.

currency: EUR
region: West Europe

scenarios:
  demo:
    label: Demo / PoC
    assumptions: Daily run, < 10 GB, 1 author, single environment, capacity paused outside runs (~60 h/month)
  sme:
    label: SME
    assumptions: Hourly run, 100 GB - 1 TB, 35 report users, dev + prod, capacity always on
  enterprise:
    label: Enterprise
    assumptions: Near real time, 10 TB+, hundreds of viewers (free on F64), 30 authors, dev + test + prod

components:
  - process: Compute (ingestion + transformation + serving)
    option: Microsoft Fabric capacity
    unit: CU-hour
    # low = 1-year reservation, high = pay-as-you-go. West Europe = North Europe list price x 1.16.
    # North Europe PAYG EUR 0.1706 and 1-year EUR 0.1015 per CU-hour, as of 2026-11-04.
    unit_price: { low: 0.118, high: 0.198 }
    source: https://sparklesolutions.ee/en/insights/fabric-capacity-pricing/
    verified_on: 2026-11-20
    usage_per_month:
      demo: { sku: F2, cu_hours: 120 }
      sme: { sku: F8, cu_hours: 5840 }
      enterprise: { sku: F64, cu_hours: 46720 }

  - process: Storage
    option: OneLake storage (hot)
    unit: GB-month
    unit_price: { low: null, high: null }
    source: https://azure.microsoft.com/pricing/details/microsoft-fabric/
    verified_on: null
    usage_per_month: { demo: { gb: 10 }, sme: { gb: 1000 }, enterprise: { gb: 10000 } }

  - process: BI consumption
    option: Power BI Pro licences (authors; all users below F64)
    unit: user-month
    unit_price: { low: 12.10, high: 12.10 }
    source: https://www.microsoft.com/en-ie/power-platform/products/power-bi/pricing
    verified_on: 2026-11-20
    usage_per_month: { demo: { users: 1 }, sme: { users: 35 }, enterprise: { users: 30 } }

  - process: CI/CD
    option: GitHub Actions (standard runners, public repo)
    unit: month
    unit_price: { low: 0, high: 0 }
    source: https://docs.github.com/billing/managing-billing-for-github-actions/about-billing-for-github-actions
    verified_on: 2026-11-20
    usage_per_month: { demo: { units: 1 }, sme: { units: 1 }, enterprise: { units: 1 } }

# Alternatives from ADR 0001 are added here with the same structure
# (Databricks DBUs, Snowflake credits) once their prices are verified.
