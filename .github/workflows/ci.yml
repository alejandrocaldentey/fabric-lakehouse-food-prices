name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"   # weekly live smoke test against the public APIs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: pytest
      - name: Generated files are up to date (cost, metrics, governance)
        run: |
          python -m cost.render && git diff --exit-code docs/cost.md
          python -m metrics.build --check
          python -m governance.build --check

  live-smoke:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Live World Bank API (blocking)
        run: pytest -m live -q tests/test_worldbank.py
      - name: Live Eurostat API (blocking)
        run: pytest -m live -q tests/test_eurostat.py
