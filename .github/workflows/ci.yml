name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"   # weekly live smoke test against the public APIs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: pytest
      - name: Cost report is up to date
        run: python -m cost.render && git diff --exit-code docs/cost.md

  live-smoke:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Live World Bank API (blocking)
        run: pytest -m live -q tests/test_worldbank.py
      - name: Live FAOSTAT API (non-blocking, upstream availability varies)
        continue-on-error: true
        run: pytest -m live -q tests/test_faostat.py
