[project]
name = "fabric-lakehouse-food-prices"
version = "0.1.0"
description = "Lakehouse architecture on Microsoft Fabric for food price transmission, fed by live public APIs."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["requests>=2.31", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ingestion*", "cost*"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls real public APIs (run in CI smoke job)"]
addopts = "-m 'not live'"
